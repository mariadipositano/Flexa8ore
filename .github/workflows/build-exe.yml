name: Compila EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:        # permette di avviarlo a mano dal tab "Actions"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Scarica il codice del repository
        uses: actions/checkout@v4

      - name: Installa Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa PyInstaller
        run: pip install pyinstaller

      - name: Compila l'eseguibile
        run: pyinstaller --onefile --noconsole --name OrarioWidget orario_widget.py

      - name: Pubblica l'exe come artefatto
        uses: actions/upload-artifact@v4
        with:
          name: OrarioWidget-Windows
          path: dist/OrarioWidget.exe
